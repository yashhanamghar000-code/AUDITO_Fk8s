# Standalone: brings up its own local Qdrant so this repo is fully
# testable without the rest of the platform.
services:
  vectorstore-service:
    build: .
    image: add-ai-vectorstore-service:local
    ports:
      - "8004:8004"
    env_file: .env
    depends_on:
      - qdrant
  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
volumes:
  qdrant_data:
