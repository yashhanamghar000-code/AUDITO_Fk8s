_format_version: "3.0"
_transform: true

# add-ai-gateway — single public entrypoint for the whole platform, now
# running on Kong instead of nginx.
#
# Same responsibilities as before:
#   /api/*  -> add-ai-backend   (strip_path: false, so backend keeps
#                                 seeing /api/... — it already mounts
#                                 all its routers under that prefix)
#   /*      -> add-ai-frontend  (SSR app server)
#
# New on top of what nginx gave us:
#   - active health checks: Kong polls each upstream's health path on
#     an interval and stops routing to it if it goes unhealthy
#   - passive health checks: live traffic failures also count, so a
#     target can be ejected faster than the active-check interval alone
#   - same rate limiting + body size limit + long LLM timeouts as before

upstreams:
  - name: backend-upstream
    healthchecks:
      active:
        type: http
        http_path: /api/health   # matches health_router's actual mount path now (prefix="/api")
        timeout: 3
        concurrency: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200, 201, 202]
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
          timeouts: 3
          http_statuses: [429, 500, 502, 503, 504]
      passive:
        type: http
        healthy:
          successes: 2
          http_statuses: [200, 201, 202, 204]
        unhealthy:
          http_failures: 3
          tcp_failures: 3
          timeouts: 3
    targets:
      - target: backend:8000
        weight: 100

  - name: frontend-upstream
    healthchecks:
      active:
        type: http
        http_path: /
        timeout: 3
        concurrency: 5
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200, 201, 202]
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
          timeouts: 3
      passive:
        type: http
        healthy:
          successes: 2
          http_statuses: [200, 201, 202, 204]
        unhealthy:
          http_failures: 3
          tcp_failures: 3
          timeouts: 3
    targets:
      - target: frontend:3000
        weight: 100

services:
  - name: backend-service
    url: http://backend-upstream
    connect_timeout: 3000         # 3s — fail fast on a dead target instead of hanging
    write_timeout: 600000         # 600s — was 300s; a 200MB upload over a slow link,
                                   # or a large-document ingestion response, needs more room
    read_timeout: 600000          # 600s — was 300s, same reasoning
    retries: 0                    # single target, no failover to retry onto — retrying
                                   # just doubles the wait for the same outcome
    routes:
      - name: backend-route
        paths:
          - /api
        strip_path: false        # backend routers already expect /api/... prefix
        preserve_host: false
    plugins:
      - name: rate-limiting
        config:
          second: 20              # matches nginx: rate=20r/s
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: request-size-limiting
        config:
          # 210 MB — was 50 MB, which silently rejected (413) any upload
          # over 50MB before it ever reached the backend. Set just above
          # the 200MB target file size to leave headroom for multipart
          # form-data overhead (boundaries/headers) around the raw file
          # bytes, so a file that is exactly 200MB still gets through.
          allowed_payload_size: 210

  - name: frontend-service
    url: http://frontend-upstream
    connect_timeout: 3000
    write_timeout: 60000
    read_timeout: 60000
    retries: 0
    routes:
      - name: frontend-route
        paths:
          - /
        strip_path: false
