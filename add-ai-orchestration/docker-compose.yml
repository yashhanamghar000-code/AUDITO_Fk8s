# add-ai-orchestration/docker-compose.yml
#
# This compose file does NOT build images.
# Every service pulls the Docker Hub image directly.
#
# Images:
#   yashhanamghar/audito-frontend:latest
#   yashhanamghar/audito-backend:latest
#   yashhanamghar/audito-worker:latest
#   yashhanamghar/audito-auth-service:latest
#   yashhanamghar/audito-data-service:latest
#   yashhanamghar/audito-embeddings-service:latest
#   yashhanamghar/audito-reranker-service:latest
#   yashhanamghar/audito-llm-service:latest
#   yashhanamghar/audito-vectorstore-service:latest
#   yashhanamghar/audito-sparseindex-service:latest
#   yashhanamghar/audito-parsing-service:latest
#
# Usage:
#
#   docker compose pull
#   docker compose up -d
#
# add-ai-core is a shared library and is not a service.

services:

  #############################################################
  # Frontend
  #############################################################

  frontend:
    image: yashhanamghar/audito-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend

  #############################################################
  # Backend
  #############################################################

  backend:
    image: yashhanamghar/audito-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - ./env/backend.env
    volumes:
      - storage:/data/storage
    depends_on:
      - embeddings-service
      - reranker-service
      - llm-service
      - vectorstore-service
      - sparseindex-service
      - data-service
      - auth-service
      - redis

  #############################################################
  # Worker
  #############################################################

  worker:
    image: yashhanamghar/audito-worker:latest
    env_file:
      - ./env/worker.env
    volumes:
      - storage:/data/storage
    depends_on:
      - parsing-service
      - embeddings-service
      - vectorstore-service
      - sparseindex-service
      - data-service
      - redis

  #############################################################
  # Authentication
  #############################################################

  auth-service:
    image: yashhanamghar/audito-auth-service:latest
    env_file:
      - ./env/auth-service.env
    depends_on:
      - data-service

  #############################################################
  # Database Service
  #############################################################

  data-service:
    image: yashhanamghar/audito-data-service:latest
    env_file:
      - ./env/data-service.env
    depends_on:
      postgres:
        condition: service_healthy

  #############################################################
  # AI Services
  #############################################################

  embeddings-service:
    image: yashhanamghar/audito-embeddings-service:latest
    env_file:
      - ./env/embeddings-service.env

  reranker-service:
    image: yashhanamghar/audito-reranker-service:latest
    env_file:
      - ./env/reranker-service.env

  llm-service:
    image: yashhanamghar/audito-llm-service:latest
    env_file:
      - ./env/llm-service.env

  parsing-service:
    image: yashhanamghar/audito-parsing-service:latest
    env_file:
      - ./env/parsing-service.env
    volumes:
      - debug_logs:/data/debug_logs

  #############################################################
  # Retrieval Services
  #############################################################

  vectorstore-service:
    image: yashhanamghar/audito-vectorstore-service:latest
    env_file:
      - ./env/vectorstore-service.env
    depends_on:
      - qdrant

  sparseindex-service:
    image: yashhanamghar/audito-sparseindex-service:latest
    env_file:
      - ./env/sparseindex-service.env
    volumes:
      - bm25_cache:/data/bm25_cache

  #############################################################
  # PostgreSQL
  #############################################################

  postgres:
    image: postgres:16
    container_name: audito-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: add_ai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  #############################################################
  # Qdrant
  #############################################################

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: audito-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  #############################################################
  # Redis
  #############################################################

  redis:
    image: redis:7-alpine
    container_name: audito-redis
    ports:
      - "6379:6379"

volumes:
  storage:
  debug_logs:
  bm25_cache:
  pg_data:
  qdrant_data: