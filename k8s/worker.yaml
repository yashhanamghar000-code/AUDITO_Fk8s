apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: audito
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: worker-config
        - secretRef:
            name: worker-secret
        image: yashhanamghar/audito-worker:latest
        imagePullPolicy: Never
        name: worker
        volumeMounts:
        - mountPath: /data/storage
          name: shared-storage-volume
      volumes:
      - name: shared-storage-volume
        persistentVolumeClaim:
          claimName: audito-shared-pvc
