apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-service-config
  namespace: audito
data:
  ANTHROPIC_MODEL: "claude-opus-5-5"
  ANTHROPIC_EFFORT: "medium"
  ANTHROPIC_MAX_TOKENS: "16000"
# ANTHROPIC_API_KEY comes from the Secret "llm-service-secret" (created out-of-band, never committed):
#   kubectl -n audito create secret generic llm-service-secret --from-file=ANTHROPIC_API_KEY=<file>
