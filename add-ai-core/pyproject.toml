[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "add-ai-core"
version = "0.1.0"
description = "Shared domain entities + interfaces (ports) for the AUDITO AI / ADD_AI platform. Zero framework/library imports. Every other repo depends on this one, never the other way round."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["add_ai_core*"]
